# Forgejo Actions pipeline (noisegarden oci-build-runner design D7/Phase 2):
# test/lint/e2e on the org `oci-build` runner, then buildah-build + push the
# image to the Forgejo registry as immutable :<git-sha> plus a moving :main.
# The deployed artifact is the sha tag — noisegarden's
# infra/clusters/root/infra/donate-portal/deployment.yaml pins it; deploying
# = bumping that sha there.
#
# Notes:
# - The `oci-build` runner is capacity:1 host-mode (jobs run inside the
#   runner container, which bakes in node + buildah + Playwright/Firefox OS
#   deps), so these jobs serialize; `bunx playwright install firefox` runs
#   WITHOUT --with-deps by design.
# - The Render deploy intentionally stays on .github/workflows/deploy.yml
#   until the donate.noisebridge.net DNS cutover to the cluster completes
#   (see the infra repo's donate-portal README runbook); then that workflow
#   loses its deploy job and this build becomes the only deploy path.
# - CI_BOT_REGISTRY_TOKEN is the org-level Actions secret (package-scoped
#   ci-bot token — the built-in job token cannot push packages, design D8).
#   The app test secrets below are Forgejo Actions secrets mirroring the
#   GitHub set (test-mode Stripe keys etc.).
name: CI/CD

on:
  push:
    branches: [main]
  # Run test/lint/e2e on PRs targeting main so breakage is caught before it
  # lands. The build/publish job stays ref-gated to refs/heads/main (see its
  # `if:` below), so PRs run the checks only — no image push or deploy.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ALERTS_USERNAME: ${{ secrets.ALERTS_USERNAME }}
  ALERTS_PASSWORD: ${{ secrets.ALERTS_PASSWORD }}
  SERVER_HOST: 127.0.0.1:3000
  STRIPE_PUBLIC: ${{ secrets.STRIPE_PUBLIC }}
  STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
  STRIPE_PORTAL_CONFIG: ${{ secrets.STRIPE_PORTAL_CONFIG }}
  GITHUB_CLIENT_ID: ${{ secrets._GITHUB_CLIENT_ID }}
  GITHUB_SECRET: ${{ secrets._GITHUB_SECRET }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
  COOKIE_SECRET: insecure!
  RESEND_KEY: ${{ secrets.RESEND_KEY }}
  TOTP_SECRET: insecure!
  DISABLE_RATE_LIMIT: true
  FRONTEND_DSN: "https://fakeurl.com"
  BACKEND_DSN: "https://fakeurl.com"

jobs:
  test:
    runs-on: oci-build
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run check

      - name: Run XSS scan
        run: bunx xss-scan

      - name: Run tests
        run: bun test

  lint:
    runs-on: oci-build
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

  e2e:
    runs-on: oci-build
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Setup Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No --with-deps: the runner image bakes in the Playwright OS deps +
      # a pinned-compatible Firefox toolchain; this fetches only the
      # app-matched browser build.
      - name: Install Playwright browsers
        run: bunx playwright install firefox

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Clean up test data
        if: always()
        run: bun run clean-up-test-data

      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    runs-on: oci-build
    needs: [test, lint, e2e]
    # Repo/ref gate (design D11): the runner is org-scoped, so pin the build
    # + registry push to this repo's main even if the trigger set widens.
    if: github.repository == 'noisebridge/donate-portal' && github.ref == 'refs/heads/main'
    env:
      IMAGE: git.noisegarden.nexus/noisebridge/donate-portal
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # STORAGE_DRIVER=vfs + BUILDAH_ISOLATION=chroot come from the runner
      # image env; ulimit caps from its containers.conf (design D3).
      - name: Build image
        run: buildah bud --build-arg GIT_COMMIT=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      # Push goes to the external registry host (design D5) — a hairpin from
      # in-cluster. If it ever breaks, the in-cluster fallback for PUSH only
      # is forgejo.forgejo.svc:3000 (pull refs must stay external).
      - name: Push image
        run: |
          printf '%s' "${{ secrets.CI_BOT_REGISTRY_TOKEN }}" \
            | buildah login --username ci-bot --password-stdin git.noisegarden.nexus
          buildah push "$IMAGE:${{ github.sha }}"
          buildah push "$IMAGE:main"
